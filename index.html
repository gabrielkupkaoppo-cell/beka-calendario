<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beka Calendário</title>
<meta name="theme-color" content="#0F2F66">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beka">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#EEF3FB;--card:#fff;--ink:#12243F;--mute:#5B6B84;--blue:#1B4FA8;--blue-d:#0F2F66;--tint:#E3ECFA;--line:#D5E0F2;--ok:#1E7B4F;--on-blue:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1730;--card:#13264A;--ink:#EAF1FF;--mute:#9DB0D3;--blue:#6FA0F5;--blue-d:#0A1A38;--tint:#1B3263;--line:#264175;--ok:#5AD39A;--on-blue:#0A1A38}}
:root[data-theme="dark"]{--bg:#0B1730;--card:#13264A;--ink:#EAF1FF;--mute:#9DB0D3;--blue:#6FA0F5;--blue-d:#0A1A38;--tint:#1B3263;--line:#264175;--ok:#5AD39A;--on-blue:#0A1A38}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--blue-d);color:#fff;padding:16px 20px 14px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--blue-d);font-weight:700;font-size:24px;display:grid;place-items:center}
.brand b{font-size:19px;display:block;line-height:1.2}.brand span{font-size:13px;opacity:.8}
.mode{display:flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px;margin-top:14px}
.mode button{flex:1;border:0;background:none;color:#fff;padding:8px;border-radius:8px;font:600 14px Figtree,sans-serif;cursor:pointer}
.mode button[aria-pressed=true]{background:#fff;color:var(--blue-d)}
main{flex:1;padding:16px 16px 40px}
h2{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:16px}.meta{font-size:13px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:start;gap:10px;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none;margin-top:7px}
.body{margin-top:10px;font-size:15px;border-top:1px solid var(--line);padding-top:10px}
.btn{border:0;background:var(--blue);color:var(--on-blue);font:600 15px Figtree,sans-serif;padding:10px 16px;border-radius:10px;cursor:pointer;margin-top:10px}
.btn:focus-visible,.nav button:focus-visible,.mode button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.done{color:var(--ok);font-weight:600;margin-top:10px;font-size:15px}
.ev{display:flex;gap:14px;align-items:center}
.date{width:54px;text-align:center;background:var(--tint);border-radius:10px;padding:6px 0;flex:none}
.date b{font-size:20px;display:block;line-height:1.1}.date span{font-size:12px;color:var(--mute)}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1 0 auto;white-space:nowrap;border:0;background:none;color:var(--mute);font:600 12px Figtree,sans-serif;padding:8px 12px;border-radius:10px;cursor:pointer}
.nav button[aria-current=page]{color:var(--blue);background:var(--tint)}
.badge{background:var(--blue);color:var(--on-blue);border-radius:99px;font-size:12px;padding:0 7px;margin-left:4px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:15px Figtree,sans-serif}
textarea{min-height:90px;resize:vertical}
.bar{height:8px;background:var(--tint);border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--blue-d);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.note{font-size:13px;color:var(--mute);margin:14px 0 0}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.login{padding:28px 16px}.login .card{padding:20px}.hint{font-size:13px;color:var(--mute);margin-top:14px}.err{color:#C0392B;font-size:14px;margin:10px 0 0;min-height:20px}
.hero{width:100%;height:150px;border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--tint)}.hero svg,.hero img{width:100%;height:100%;object-fit:cover;display:block}
.out{border:1px solid rgba(255,255,255,.45);background:none;color:#fff;border-radius:8px;padding:6px 12px;font:600 13px Figtree,sans-serif;cursor:pointer}
.up{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mute);cursor:pointer;font-size:14px;margin-top:12px}.prev{width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:600 14px Figtree,sans-serif;cursor:pointer}.chip[aria-pressed=true]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.tag{display:inline-block;background:var(--tint);color:var(--blue);border-radius:6px;padding:0 8px;font-size:12px;font-weight:600;margin-left:8px}
.act{display:flex;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}.act button{border:0;background:var(--tint);color:var(--blue);border-radius:8px;padding:7px 12px;font:600 14px Figtree,sans-serif;cursor:pointer}.act button[aria-pressed=true]{background:var(--blue);color:var(--on-blue)}
.cmt{font-size:14px;margin-top:8px;background:var(--bg);border-radius:10px;padding:8px 12px}.cmt b{display:block;font-size:13px}.cmf{display:flex;gap:8px;margin-top:10px}.cmf input{flex:1}.cmf .btn{margin-top:0}
.act a{background:var(--tint);color:var(--blue);border-radius:8px;padding:7px 12px;font:600 14px Figtree,sans-serif;text-decoration:none}.act a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sm{border:0;background:none;color:#C0392B;font:600 13px Figtree,sans-serif;cursor:pointer;padding:0;margin-left:10px}
.chip:focus-visible,.act button:focus-visible,.sm:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dd{position:relative;margin-top:12px}
.ddb{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:10px 14px;font:600 15px Figtree,sans-serif;cursor:pointer}
.ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:60vh;overflow-y:auto;padding:6px}
.ddl button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:600 15px Figtree,sans-serif;padding:12px 12px;border-radius:8px;cursor:pointer}
.ddl button[aria-current=page]{background:var(--tint);color:var(--blue)}
.ddb:focus-visible{outline:3px solid #fff;outline-offset:2px}.ddl button:focus-visible{outline:3px solid var(--blue);outline-offset:-2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">B</div><div><b>Beka</b><span>Freguesia do Ó · Protótipo</span></div></div>
    <div id="who" style="display:none;justify-content:space-between;align-items:center;margin-top:12px;font-size:15px"><span id="hi"></span><button class="out" data-out="1">Sair</button></div>

</div>
<div class="toast" id="toast" role="status"></div>
<script>
var USERS=[{e:'responsavel@beka.com.br',p:'beka123',name:'Marina',role:'pais'},{e:'secretaria@beka.com.br',p:'beka123',name:'Secretaria',role:'sec'},{e:'professor@beka.com.br',p:'beka123',name:'Prof. Ricardo',role:'prof'},{e:'direcao@beka.com.br',p:'beka123',name:'Direção',role:'dir'},{e:'dono@produto.com.br',p:'beka123',name:'Dono do produto',role:'dono'}];
var S={user:null,img:null,mode:'pais',tab:'com',open:null,
com:[
{id:3,k:'reuniao',t:'Reunião de pais do 3º ano',to:'3º ano',d:'22/10',b:'A reunião será na quinta, dia 30, às 19h, no auditório. Contamos com a presença de um responsável por aluno.',read:false,sent:52,seen:31},
{id:2,k:'provas',t:'Semana de provas bimestrais',to:'Escola toda',d:'20/10',b:'As provas acontecem de 3 a 7 de novembro. O cronograma por turma está na aba Agenda.',read:false,sent:210,seen:164},
{id:1,k:'uniforme',t:'Uniforme de Educação Física',to:'Escola toda',d:'15/10',b:'Lembramos que o uniforme de Educação Física é obrigatório nas aulas práticas.',read:true,sent:210,seen:198}],
ev:[['28','out','Entrega do trabalho de Ciências'],['30','out','Reunião de pais do 3º ano, 19h'],['03','nov','Início das provas bimestrais'],['14','nov','Visita ao Museu do Ipiranga'],['20','nov','Feriado: Consciência Negra']],
auth:false};
function art(k){var bg={reuniao:'#BFE0FF',provas:'#FFE08A',uniforme:'#BDEFD0',aviso:'#FFC9D6'}[k]||'#BFE0FF',g='';
if(k==='reuniao')g='<circle cx="335" cy="38" r="24" fill="#FFC43D"/><rect x="40" y="55" width="140" height="95" fill="#1B4FA8"/><rect x="58" y="75" width="26" height="26" fill="#fff"/><rect x="100" y="75" width="26" height="26" fill="#fff"/><rect x="140" y="75" width="26" height="26" fill="#fff"/><circle cx="235" cy="100" r="16" fill="#FF7A59"/><circle cx="275" cy="100" r="16" fill="#7B61FF"/><circle cx="315" cy="100" r="16" fill="#2EC4A6"/><rect x="217" y="118" width="36" height="32" rx="12" fill="#FF7A59"/><rect x="257" y="118" width="36" height="32" rx="12" fill="#7B61FF"/><rect x="297" y="118" width="36" height="32" rx="12" fill="#2EC4A6"/>';
else if(k==='provas')g='<rect x="60" y="28" width="120" height="100" rx="8" fill="#fff"/><rect x="78" y="48" width="84" height="8" fill="#1B4FA8"/><rect x="78" y="68" width="60" height="8" fill="#9DB7E8"/><rect x="78" y="88" width="72" height="8" fill="#9DB7E8"/><rect x="230" y="92" width="46" height="46" rx="6" fill="#FF7A59"/><rect x="280" y="92" width="46" height="46" rx="6" fill="#2EC4A6"/><rect x="255" y="44" width="46" height="46" rx="6" fill="#7B61FF"/><rect x="196" y="50" width="14" height="80" rx="3" fill="#1B4FA8" transform="rotate(25 203 90)"/>';
else if(k==='uniforme')g='<path d="M130 40l40-14c8 14 52 14 60 0l40 14 28 38-34 16-14-18v76H150V76l-14 18-34-16z" fill="#1B4FA8"/><circle cx="200" cy="78" r="14" fill="#fff"/><circle cx="60" cy="40" r="18" fill="#FFC43D"/><circle cx="345" cy="110" r="22" fill="#FF7A59"/>';
else g='<circle cx="90" cy="58" r="26" fill="#FF7A59"/><circle cx="150" cy="42" r="26" fill="#FFC43D"/><circle cx="210" cy="58" r="26" fill="#2EC4A6"/><circle cx="270" cy="42" r="26" fill="#7B61FF"/><circle cx="330" cy="58" r="26" fill="#1B4FA8"/><path d="M90 84 L200 140M150 68 L200 140M210 84 L200 140M270 68 L200 140M330 84 L200 140" stroke="#fff" stroke-width="3"/>';
return '<svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="150" fill="'+bg+'"/>'+g+'</svg>'}
function hero(c){return '<div class="hero">'+(c.img?'<img alt="" src="'+c.img+'">':art(c.k))+'</div>'}
function viewLogin(){return '<div class="login"><div class="card"><h2>Entrar no Beka Agenda</h2><label for="lu">E-mail</label><input id="lu" type="email" autocomplete="username" placeholder="voce@email.com"><label for="lp">Senha</label><input id="lp" type="password" autocomplete="current-password"><p class="err" id="le" role="alert"></p><button class="btn" data-login="1" style="width:100%">Entrar</button><p class="hint">Para testar, use a senha beka123 com um destes e-mails: responsavel@beka.com.br (pais), secretaria@beka.com.br, professor@beka.com.br, direcao@beka.com.br ou dono@produto.com.br (quem vende o app para as escolas).</p></div></div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast on';setTimeout(function(){t.className='toast'},1800)}
function unread(){return S.com.filter(function(c){return !c.read}).length}
function viewCom(){var h='<h2>Comunicados</h2>';S.com.forEach(function(c){var o=S.open===c.id;
h+='<div class="card">'+hero(c)+'<div class="row" tabindex="0" role="button" aria-expanded="'+o+'" data-open="'+c.id+'">'+(c.read?'':'<span class="dot" title="Não lido"></span>')+'<div style="flex:1"><h3>'+esc(c.t)+'</h3><div class="meta">'+esc(c.to)+' · '+c.d+'</div></div></div>';
if(o){h+='<div class="body">'+esc(c.b)+'</div>'+(c.read?'<div class="done">Leitura confirmada</div>':'<button class="btn" data-read="'+c.id+'">Confirmar leitura</button>')}
h+='</div>'});return h}
function viewAg(){var h='<h2>Agenda</h2>';S.ev.forEach(function(e){h+='<div class="card ev"><div class="date"><b>'+e[0]+'</b><span>'+e[1]+'</span></div><div>'+esc(e[2])+'</div></div>'});return h}
function viewPas(){return '<h2>Passeios e autorizações</h2><div class="card"><h3>Visita ao Museu do Ipiranga</h3><div class="meta">14/11 · Saída às 8h, retorno às 12h · Helena, 3º ano B</div><div class="body">Autorize a participação da Helena. Em breve, o pagamento do passeio também poderá ser feito por aqui.</div>'+(S.auth?'<div class="done">Participação autorizada</div>':'<button class="btn" data-auth="1">Autorizar participação</button>')+'</div>'}
function viewSec(){var h='<h2>Novo comunicado</h2><div class="card"><label for="ft">Título</label><input id="ft" placeholder="Ex.: Festa junina">'
+'<label for="fd">Enviar para</label><select id="fd"><option>Escola toda</option><option>Educação Infantil</option><option>Fundamental I</option><option>Fundamental II</option><option>3º ano</option></select>'
+'<label for="fm">Mensagem</label><textarea id="fm" placeholder="Escreva o aviso para as famílias"></textarea><label class="up" for="fi">Toque para escolher uma foto da escola (opcional)</label><input id="fi" type="file" accept="image/*" hidden><img id="pv" class="prev" alt="Prévia da imagem escolhida" hidden><button class="btn" data-pub="1">Publicar comunicado</button></div><h2>Enviados</h2>';
S.com.forEach(function(c){var p=Math.round(c.seen/c.sent*100);h+='<div class="card"><h3>'+esc(c.t)+'</h3><div class="meta">'+esc(c.to)+' · '+c.d+'</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="meta" style="margin-top:6px">'+c.seen+' de '+c.sent+' famílias confirmaram a leitura</div></div>'});
return h+'<p class="note">Na versão final, a secretaria também vê quem ainda não leu e reenvia o aviso com um toque.</p>'}
function render(){var m=document.getElementById('main'),n=document.getElementById('nav'),w=document.getElementById('who');
if(!S.user){w.style.display='none';n.style.display='none';m.innerHTML=viewLogin();return}
w.style.display='flex';document.getElementById('hi').textContent='Olá, '+S.user.name;S.mode=S.user.role;

if(S.mode==='pais'){n.style.display='flex';var u=unread();n.innerHTML=[['com','Comunicados'+(u?'<span class="badge">'+u+'</span>':'')],['ag','Agenda'],['pas','Passeios']].map(function(t){return '<button data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join('');
m.innerHTML=S.tab==='com'?viewCom():S.tab==='ag'?viewAg():viewPas()}else{n.style.display='none';m.innerHTML=viewSec()}}
document.addEventListener('click',function(e){var t=e.target.closest('[data-open],[data-read],[data-auth],[data-pub],[data-tab],[data-out],[data-login]');if(!t)return;
if(t.dataset.out){S.user=null;S.tab='com';S.open=null}else if(t.dataset.login){var em=document.getElementById('lu').value.trim().toLowerCase(),pw=document.getElementById('lp').value,us=USERS.filter(function(x){return x.e===em&&x.p===pw})[0];if(!us){document.getElementById('le').textContent='E-mail ou senha incorretos. Confira e tente de novo.';return}S.user=us}
else if(t.dataset.tab){S.tab=t.dataset.tab}
else if(t.dataset.open){var i=+t.dataset.open;S.open=S.open===i?null:i}
else if(t.dataset.read){S.com.forEach(function(c){if(c.id==+t.dataset.read)c.read=true});toast('Leitura confirmada')}
else if(t.dataset.auth){S.auth=true;toast('Participação autorizada')}
else if(t.dataset.pub){var ti=document.getElementById('ft').value.trim(),ms=document.getElementById('fm').value.trim();if(!ti||!ms){toast('Preencha título e mensagem');return}
S.com.unshift({id:Date.now(),t:ti,to:document.getElementById('fd').value,d:'hoje',b:ms,k:'aviso',img:S.img,tarefa:!!document.getElementById('ftk').checked,urg:!!(document.getElementById('fu')||{}).checked,anx:(function(){var f=document.getElementById('fa');return f&&f.files[0]?[{n:f.files[0].name}]:[]})(),s:ms.length>80?ms.slice(0,80)+'…':ms,cmOn:!!document.getElementById('fc').checked,alvo:({'3º ano':'Helena','Fundamental II':'Pedro'})[document.getElementById('fd').value]||'',lk:0,cm:[],read:false,sent:210,seen:0});S.img=null;toast('Comunicado publicado')}
render()});
document.addEventListener('change',function(e){if(e.target.id!=='fi'||!e.target.files[0])return;var r=new FileReader();r.onload=function(){S.img=r.result;var p=document.getElementById('pv');p.src=S.img;p.hidden=false};r.readAsDataURL(e.target.files[0])});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.target.id==='lu'||e.target.id==='lp')){document.querySelector('[data-login]').click();return}if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.open){e.preventDefault();e.target.click()}});
var KIDS=[{n:'Helena',t:'3º ano B'},{n:'Pedro',t:'7º ano A'}],TURMAS=['Infantil 2 A','1º ano A','3º ano A','3º ano B','5º ano A','7º ano A','9º ano A'];
S.kid='todos';S.cmo=null;S.auth={Helena:false,Pedro:false};
S.fam=[{r:'Marina Souza',e:'responsavel@beka.com.br',a:['Helena (3º ano B)','Pedro (7º ano A)']},{r:'Carla Mendes',e:'carla@email.com',a:['Lucas (3º ano A)']}];
S.com.forEach(function(c){c.lk=c.id==3?12:c.id==2?30:8;c.cm=[];c.cmOn=false;c.alvo=c.id==3?'Helena':''});
S.com[0].cmOn=true;S.com[0].cm=[{a:'Carla, responsável',x:'Posso levar meu marido também?'}];
S.com.splice(2,0,{id:4,k:'aviso',t:'Olimpíada de Matemática',to:'7º ano',d:'18/10',b:'As inscrições vão até 5 de novembro, na secretaria.',read:false,sent:48,seen:20,lk:5,cm:[],cmOn:false,alvo:'Pedro'});
function byId(i){return S.com.filter(function(c){return c.id===i})[0]}
function visible(c){return S.kid==='todos'||!c.alvo||c.alvo===S.kid}
function kidbar(){if(S.tab==='ag'||S.tab==='arq'||S.tab==='doc'||S.tab==='bus')return '';return '<div class="chips" role="group" aria-label="Escolher filho"><button class="chip" data-kid="todos" aria-pressed="'+(S.kid==='todos')+'">Todos os filhos</button>'+KIDS.map(function(k){return '<button class="chip" data-kid="'+k.n+'" aria-pressed="'+(S.kid===k.n)+'">'+k.n+' ('+k.t+')</button>'}).join('')+'</div>'}
